{% extends "base.html" %}
{% block title %}پاسورڈ تبدیل کریں{% endblock %}
{% set active_page = 'settings' %}

{% block extra_head %}
<style>
    .narrow-form-wrap {
        max-width: 480px;
        margin: 0 auto;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 18px;
    }

    .form-group label {
        font-weight: 700;
        margin-bottom: 7px;
        color: #334155;
        font-size: 13.5px;
    }

    .form-group input {
        padding: 11px 14px;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: var(--transition);
    }

    .form-group input:focus {
        border-color: var(--primary-teal);
        box-shadow: 0 0 0 3px rgba(26, 95, 122, 0.15);
    }

    .strength-bar-bg {
        background: #e2e8f0;
        border-radius: 20px;
        height: 6px;
        width: 100%;
        overflow: hidden;
        margin-top: 8px;
    }
    .strength-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 20px;
        transition: width 0.3s ease, background 0.3s ease;
    }
    .strength-label {
        font-size: 12px;
        font-weight: 700;
        display: block;
        margin-top: 4px;
    }
</style>
{% endblock %}

{% block content %}
    <div class="narrow-form-wrap">
        <h2 style="color: var(--primary-teal); font-family: 'Noto Nastaliq Urdu', serif; text-align: center; margin-bottom: 24px;">🔐 اپنا پاسورڈ تبدیل کریں</h2>

        <form method="POST">
            <div class="form-group">
                <label>موجودہ پاسورڈ:</label>
                <input type="password" name="current_password" required placeholder="موجودہ پاسورڈ درج کریں">
            </div>
            <div class="form-group">
                <label>نیا پاسورڈ:</label>
                <input type="password" name="new_password" id="new_password" required placeholder="کم از کم 8 حروف، ایک حرف اور ایک ہندسہ" minlength="8" oninput="checkStrength(this.value)">
                <div class="strength-bar-bg"><div id="strength-bar-fill" class="strength-bar-fill"></div></div>
                <span id="strength-label" class="strength-label"></span>
            </div>
            <div class="form-group">
                <label>نیا پاسورڈ دوبارہ لکھیں:</label>
                <input type="password" name="confirm_password" required placeholder="تصدیق کے لیے دوبارہ لکھیں" minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">پاسورڈ محفوظ کریں</button>
        </form>
    </div>
{% endblock %}

{% block extra_scripts %}
<script>
function checkStrength(password) {
    const bar = document.getElementById('strength-bar-fill');
    const label = document.getElementById('strength-label');
    let score = 0;

    if (password.length >= 8) score++;
    if (password.length >= 12) score++;
    if (/[A-Za-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    if (password.length === 0) {
        bar.style.width = '0%';
        label.innerText = '';
        return;
    }

    if (score <= 2) {
        bar.style.width = '33%';
        bar.style.background = '#dc3545';
        label.style.color = '#dc3545';
        label.innerText = 'کمزور پاسورڈ';
    } else if (score <= 4) {
        bar.style.width = '66%';
        bar.style.background = '#ffc107';
        label.style.color = '#92400e';
        label.innerText = 'درمیانہ پاسورڈ';
    } else {
        bar.style.width = '100%';
        bar.style.background = '#28a745';
        label.style.color = '#28a745';
        label.innerText = 'مضبوط پاسورڈ';
    }
}
</script>
{% endblock %}
